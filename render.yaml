# Render Blueprint — 一键部署
# 数据库请用 Neon（免费永久），在 Render 环境变量填入 DATABASE_URL
services:
  - type: web
    name: team-daily-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

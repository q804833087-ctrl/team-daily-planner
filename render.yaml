# Render Blueprint — 一键部署（含免费数据库）
services:
  - type: web
    name: team-daily-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team-daily-db
          property: connectionString

databases:
  - name: team-daily-db
    plan: free
    databaseName: team_daily
    user: team_daily

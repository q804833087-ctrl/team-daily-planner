{% extends "base.html" %}
{% from "icons.html" import icon_chart %}
{% block title %}管理者登录{% endblock %}
{% block content %}
<div class="page-brand">
  {{ icon_chart(22) }}
  <span>管理者入口</span>
</div>

<div class="card">
  <form method="post" action="{{ url_for('manager_auth') }}">
    <label class="field-label" for="pin">PIN</label>
    <input type="password" id="pin" name="pin" class="pin-input" placeholder="输入 PIN" maxlength="8" autofocus required>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <button type="submit" class="btn btn-primary" style="margin-top:16px">进入</button>
  </form>
</div>

<div class="footer-link">
  <a href="{{ url_for('index') }}">返回首页</a>
</div>
{% endblock %}

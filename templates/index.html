{% extends "base.html" %}
{% block title %}团队日计划{% endblock %}
{% block content %}
<div class="date-hero">
  <div class="date-label">今日</div>
  <div class="date-value">{{ date_display }}</div>
</div>

<div class="header" style="padding-top:8px">
  <h1>{{ cfg.team_name }}</h1>
  <p>输入姓名，填写今日工作计划</p>
</div>

<div class="card">
  <form method="post" action="{{ url_for('join') }}">
    <label class="field-label" for="name">您的姓名</label>
    <input type="text" id="name" name="name" class="name-input" placeholder="请输入您的姓名" maxlength="20" autofocus required>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="margin-top:16px">进入 · 填写今日计划</button>
  </form>
</div>

<div class="card" style="background:#f8fafc">
  <p style="font-size:14px;color:var(--muted);line-height:1.8">
    <strong style="color:var(--text)">使用说明</strong><br>
    ① 白天：填写今日要做的工作任务<br>
    ② 晚上：勾选每项任务的完成情况<br>
    ③ 管理者可在看板查看全员进度
  </p>
</div>

<div class="footer-link">
  <a href="{{ url_for('manager_login') }}">管理者入口 →</a>
</div>
{% endblock %}

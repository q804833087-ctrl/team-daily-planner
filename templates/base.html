<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}团队日计划{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0f4c81;
      --primary-light: #e8f1f8;
      --primary-dark: #0a3558;
      --accent: #3b82f6;
      --success: #059669;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.04);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: auto;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 36px; }
    .ico { display: block; flex-shrink: 0; }
    .page-brand {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 16px; color: var(--primary);
    }
    .page-brand span { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
    .date-hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px;
    }
    .date-hero .date-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
    }
    .date-hero .date-label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .date-hero .date-value { font-size: 17px; font-weight: 700; margin-top: 2px; color: var(--text); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 15px; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px; color: var(--text);
    }
    .card-title .ico-wrap {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
    }
    .badge {
      display: inline-flex; align-items: center; font-size: 11px;
      padding: 3px 8px; border-radius: 6px; font-weight: 600;
    }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-green { background: #d1fae5; color: #047857; }
    .badge-gray { background: #f1f5f9; color: #64748b; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.done { background: var(--success); }
    .status-dot.pending { background: #cbd5e1; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 13px 16px; border: none; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:active { opacity: .85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-outline {
      background: var(--card); border: 1.5px solid var(--border); color: var(--muted);
    }
    .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; display: inline-flex; }
    .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
    .name-input, input[type="password"], input[type="text"].pin-input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 16px; outline: none; background: #fff;
    }
    .name-input:focus, .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .task-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .task-input-row input[type="text"] {
      flex: 1; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 15px; outline: none;
    }
    .task-input-row input:focus { border-color: var(--accent); }
    .remove-btn {
      width: 36px; height: 36px; border: none; border-radius: 8px;
      background: #fef2f2; color: var(--danger); cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .task-check {
      display: flex; align-items: flex-start; gap: 12px; cursor: pointer; flex: 1;
    }
    .task-check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--success); }
    .task-check .content { flex: 1; font-size: 15px; line-height: 1.45; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; padding: 10px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 14px;
    }
    .top-bar .user { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .top-bar a {
      display: flex; align-items: center; gap: 4px;
      color: var(--muted); text-decoration: none; font-size: 13px;
    }
    .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px; text-align: center; box-shadow: var(--shadow);
    }
    .stat-box .num { font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-box.warn .num { color: var(--danger); }
    .member-row {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px; margin-bottom: 10px; background: #fff;
    }
    .member-row .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .member-row .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .member-row .name-ico { display: flex; color: var(--muted); }
  .member-row .meta .rate { font-size: 13px; font-weight: 600; color: var(--primary); }
    .member-row .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .progress-bar .fill { height: 100%; background: var(--success); border-radius: 2px; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
    .footer-link a { color: var(--muted); text-decoration: none; }
    .footer-link a:hover { color: var(--primary); }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 12px 22px;
      border-radius: 24px; font-size: 14px; z-index: 999;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 14px; }
    .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      text-decoration: none; color: var(--muted); background: #f1f5f9; border: 1px solid transparent;
    }
    .filter-btn.active { background: var(--primary); color: #fff; }
    .daily-quote {
      text-align: center; font-size: 14px; color: var(--text);
      margin: -4px 0 14px; padding: 12px 16px; line-height: 1.6;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); box-shadow: var(--shadow);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <div class="toast" id="toast"></div>
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
